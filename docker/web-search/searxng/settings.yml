use_default_settings: true

general:
  debug: false
  instance_name: "context-kit-search"
  donation_url: false
  contact_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  # Local placeholder. Keep SearXNG bound to 127.0.0.1 unless you review this
  # config and replace the secret_key for a deliberate non-local deployment.
  secret_key: "local-only-change-if-exposed"
  limiter: false
  image_proxy: true
  bind_address: "0.0.0.0"

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 20
  pool_maxsize: 20

engines:
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: google
    disabled: false
